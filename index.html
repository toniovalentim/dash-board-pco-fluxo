<script>
(function(){

/* =========================================================================
   CONFIG
   ========================================================================= */
var CYCLES = [
  { id:'out25', label:'Outubro/25', fileId:'1ocA2nfAoUWmRs7i3Zgp9HfZbreWIBmemnwY2D0XeFxU' },
  { id:'jan26', label:'Janeiro/26', fileId:'1bdrXC4-O0yO4WdppyRJDpxl-VU7n9UM4kF0hsK27Ocs' },
  { id:'abril26', label:'Abril/26', fileId:'1h4F96jgigS4H7UCLIyyNN9nBB17hDW0MDfX4vTdUNg0' },
  { id:'julho26', label:'Julho/26', fileId:'1EVwf74QJnyDhgW3lsVpSjBNUA3aljP4derzCg7jRATU' }
];
var DRIVE_TOOL = 'mcp__1d7ec9dc-7267-4e2e-970a-b7f91d66d4f7__download_file_content';
var COORD_LIST = ['ACE','CCE','MNP','PRO','QAB'];              // coordenações "de projeto"
var COORD_ALL = ['ACE','CCE','MNP','PRO','QAB','COMERCIAL'];   // + comercial
var COORD_COLOR = { ACE:'#f4c20d', CCE:'#e8578f', MNP:'#d1372c', COMERCIAL:'#2e6ee8', PRO:'#8c4fd6', QAB:'#2f9e58' };
var COORD_DISPLAY = { ACE:'ACE', CCE:'CCE', MNP:'MNP', COMERCIAL:'COM', PRO:'PRO', QAB:'QAB' };
var ORANGE = '#ff6a13';
var DE_COLOR = '#1a1512';
var DIRETORIAS = ['Adm-Fin','Gente & Gestão','Marketing e Vendas','Presidência','Diretoria de Projetos'];
var DIR_PALETTE = ['#ff6a13','#2e6ee8','#8c4fd6','#2f9e58','#e8578f'];
var CARGO_EXCLUDE_COORD = ['Área de Suporte Tático (Assessores/Responsável do PAME)'];

/* ============================= CSV PARSER =============================== */
function parseCSV(text){
  var rows = []; var row = []; var field = ''; var inQuotes = false;
  for (var i=0; i<text.length; i++){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field=''; }
      else if (c === '\r'){ }
      else if (c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0]==='' ); });
}
function base64ToUtf8(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/* ============================= HEADER MATCH ============================= */
function normH(h){ return (h||'').replace(/[–—‒]/g,'-').replace(/\s+/g,' ').trim(); } // normaliza en-dash/em-dash -> hífen (o formulário mistura os dois entre perguntas, ex: Q62.2)
function findCol(headers, qPrefix, bracketIncludes){
  for (var i=0;i<headers.length;i++){
    var h = normH(headers[i]);
    if (h.indexOf(qPrefix) === 0){
      if (!bracketIncludes) return i;
      if (h.indexOf(bracketIncludes) !== -1) return i;
    }
  }
  return -1;
}
function findColContains(headers, substr){
  for (var i=0;i<headers.length;i++){
    if (normH(headers[i]).toLowerCase().indexOf(substr.toLowerCase()) !== -1) return i;
  }
  return -1;
}

/* ===================== LIKERT NORMALIZER (texto -> 1..4) ================= */
var LIKERT_MAP = [
  ['não tenho suporte',1],['tenho pouco suporte',2],['tenho um suporte razoavelmente bom',3],['tenho todo o suporte necessário',4],
  ['nada confortável',1],['pouco confortável',2],['muito confortável',4],['confortável',3],
  ['discordo completamente',1],['discordo parcialmente',2],['concordo parcialmente',3],['concordo completamente',4],
  ['não me identifico',1],['pouco me identifico',2],['me identifico parcialmente',3],['me identifico completamente',4],
  ['não me representa',1],['pouco me representa',2],['me representa parcialmente',3],['me representa completamente',4],
  ['totalmente insatisfeito',1],['totalmente satisfeito',4],
  ['muito insatisfeito',1],['bastante satisfeito',4],
  ['bem insatisfeito',1],['muito satisfeito',4],
  ['insuficiente',1],['péssimo',1],['ruim',2],['bom',3],['ótimo',4],['excelente',4],
  ['nada feliz',1],['pouco feliz',2],['muito feliz',4],
  ['muito desmotivado',1],['muito motivado',4],
  ['não me sinto reconhecido',1],['devidamente reconhecido',4],
  ['não recomendaria',1],['recomendaria',4],
  ['menos motivado',1],['mais motivada',4],['mais motivado',4],
  ['não me sinto integrado',1],['muito integrado',4],
  ['nenhuma',1],['muitas',4],
  ['impactam negativamente',1],['me fazem refletir',4],
  ['não me motivam',1],['motivam bastante',4]
];
function likertValue(raw){
  if (raw === undefined || raw === null) return NaN;
  var s = String(raw).trim();
  if (s === '') return NaN;
  if (/^-?\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(',','.'));
  var low = s.toLowerCase();
  for (var i=0;i<LIKERT_MAP.length;i++){ if (low.indexOf(LIKERT_MAP[i][0]) !== -1) return LIKERT_MAP[i][1]; }
  return NaN;
}
/* trunca respostas descritivas longas em "Rótulo - explicação..." -> "Rótulo" */
function shortLabel(raw){
  if (!raw) return raw;
  var s = String(raw).trim();
  var m = s.split(/\s[-–]\s/);
  return m[0].trim();
}
/* Some checkbox questions (PCD, Neurodivergência) join multiple chosen options in one cell as
   "Sim, Rótulo - descrição longa (pode ter vírgulas)., Sim, Outro Rótulo - outra descrição.".
   A naive split(',') shreds the long descriptions. Split only at boundaries right before a new
   option starts ("Sim,"/"Não"/"Prefiro"), then keep just the short label of each option. */
function splitCheckboxDesc(raw){
  if (!raw) return [];
  var parts = String(raw).split(/,\s*(?=Sim,|Não|Prefiro)/);
  var out = [];
  parts.forEach(function(p){
    p = p.trim().replace(/\.+$/,'');
    if (!p) return;
    var m = p.match(/^Sim,\s*([^\-]+?)\s*-/);
    out.push(m ? m[1].trim() : p);
  });
  return out;
}

/* ============================= DATA STATE ================================ */
var STATE = { cycles:{}, filters:{ ciclo:{}, pame:{}, area:{}, diretoria:{}, cargo:{}, genero:{}, orient:{}, raca:{}, pcd:{}, neuro:{} }, charts:[] };
function destroyCharts(){ STATE.charts.forEach(function(c){ try{ c.destroy(); }catch(e){} }); STATE.charts = []; }

/* ============================= LOAD ======================================= */
function loadCycle(cfg){
  return window.cowork.callMcpTool(DRIVE_TOOL, { fileId: cfg.fileId, exportMimeType: 'text/csv' })
    .then(function(r){
      var payload = r.structuredContent;
      if (!payload){
        var txt = (r.content && r.content[0] && r.content[0].text) || '{}';
        try{ payload = JSON.parse(txt); }catch(e){ payload = {}; }
      }
      var csvText = base64ToUtf8(payload.content || '');
      var table = parseCSV(csvText);
      var headers = table.length ? table[0] : [];
      var rows = table.slice(1).filter(function(r){ return r.some(function(v){return v && v.trim()!=='';}); });
      return { id:cfg.id, label:cfg.label, headers:headers, rows:rows };
    })
    .catch(function(err){ return { id:cfg.id, label:cfg.label, headers:[], rows:[], error:String(err && err.message || err) }; });
}

    coord75_melhoria: findCol(h,'Q75 -'),

    /* Tropa se autoavalia */
    tropaSatisf: findCol(h,'Q12 -'),

    tropa_conf_expor: findCol(h,'Q14 -','[Expor suas dificuldades'),
    tropa_conf_opAtiv: findCol(h,'Q14 -','[Opinar nas atividades'),
    tropa_conf_opDisc: findCol(h,'Q14 -','[Opinar nas discussões'),

    alinhComercial: findCol(h,'Q16 -'),

function val(cycle,row,key){ var i = cycle.col[key]; if (i===undefined||i<0) return ''; return row[i]!==undefined ? row[i] : ''; }
function num(cycle,row,key){ return likertValue(val(cycle,row,key)); }
function numAny(cycle,row,keys){ for (var i=0;i<keys.length;i++){ var v = num(cycle,row,keys[i]); if (!isNaN(v)) return v; } return NaN; }

function pame(cycle,row){ return (val(cycle,row,'pame')||'').trim(); }
function cargo(cycle,row){
  var v = (val(cycle,row,'cargo')||'').trim();
  // Unifica variantes ("Diretor/a Executivo/a - Diretor/a de Projetos" / "- Outras Diretorias")
  // em um único cargo "Diretor/a Executivo/a", conforme pedido: não diferenciar Diretor de Projetos dos demais.
  if (v.indexOf('Diretor/a Executivo/a') === 0) return 'Diretor/a Executivo/a';
  return v;
}
function rawArea(cycle,row){ return (val(cycle,row,'area')||'').trim().toUpperCase(); }
function genero(cycle,row){ return shortLabel(val(cycle,row,'genero')); }
function orientacao(cycle,row){ return shortLabel(val(cycle,row,'orientacao')); }
function raca(cycle,row){
  var v = val(cycle,row,'raca'); if (!v) return '';
  v = shortLabel(v).trim().replace(/^Pessoa\s+/i,'');
  return v ? v.charAt(0).toUpperCase()+v.slice(1) : '';
}
function direcionadoArea(cycle,row){ var v=(val(cycle,row,'direcionadoArea')||'').trim(); return v==='Não sou direcionado' ? '' : v; }

/* área "primária" do respondente (Q2), usada para filtros e segmentações gerais (eNPS por área, etc.) */
function area(cycle,row){ return rawArea(cycle,row); }
function isComDirecionado(cycle,row){ return direcionadoArea(cycle,row) === 'Comercial'; }

function effectiveCoordForAlignment(cycle,row){
  var a = rawArea(cycle,row);
  if (a === 'COMERCIAL'){ var c = (val(cycle,row,'coordNegocia')||'').trim().toUpperCase(); return COORD_LIST.indexOf(c)!==-1 ? c : null; }
  return COORD_LIST.indexOf(a)!==-1 ? a : null;
}
/* Quem está avaliando (pra breakdowns "quem recomenda X"): uma das 6 coordenações, ou 'DE' —
   a Diretoria Executiva também responde Q66.3-66.7 (recomendaria cada coordenação a um cliente),
   mas o Q2 dela é "DE" (não uma coordenação), então sem isso ela ficava de fora do breakdown. */
function evaluatorGroup(cycle,row){
  var a = rawArea(cycle,row);
  if (COORD_ALL.indexOf(a) !== -1) return a;
  if (a.indexOf('DE') === 0) return 'DE';
  return null;
}

/* diretoria efetiva (páginas de Diretoria): direcionado (exceto Comercial) > suporte tático (Q9) > diretor (Q4) */
function diretoriaInfo(cycle,row){
  var da = direcionadoArea(cycle,row);
  if (da && da !== 'Comercial') return { diretoria: da, papel:'Direcionado' };
  var c = cargo(cycle,row);
  if (c.indexOf('Suporte Tático') !== -1) return { diretoria: (val(cycle,row,'diretoriaBloco3')||'').trim(), papel:'Suporte Tático' };
  if (c.indexOf('Diretor/a Executivo/a') !== -1) return { diretoria: (val(cycle,row,'diretoriaDE')||'').trim(), papel:'Diretor/a' };
  return { diretoria:'', papel:'' };
}
function dirVal(cycle,row,blocoKey,direcKey){
  var info = diretoriaInfo(cycle,row);
  if (info.papel === 'Direcionado') return direcKey ? num(cycle,row,direcKey) : NaN;
  return num(cycle,row,blocoKey);
}

/* ============================= FILTERING ================================== */
/* Cargo/Diretoria (origem) mudam de significado conforme o grupo de páginas atual:
   - grupo 'coord': cargo() cru (Q3, já unificado) / area() (coordenação, Q2)
   - grupo 'dir'  : diretoriaInfo().papel (Direcionado/Suporte Tático/Diretor/a) / diretoriaInfo().diretoria
   - grupo 'missao': Cargo e PAME não se aplicam (ficam ocultos e neutralizados)
   - grupo 'geral': Cargo/PAME normais; Coordenação/Diretoria ocultos (skipArea é usado nas queries) */
function currentGroup(){ return GROUP_OF_PAGE[currentPage]; }
function cargoValueFor(cycle,row){ var g=currentGroup(); return g==='dir' ? diretoriaInfo(cycle,row).papel : cargo(cycle,row); }
function areaOrDirValueFor(cycle,row){ var g=currentGroup(); return g==='dir' ? diretoriaInfo(cycle,row).diretoria : area(cycle,row); }

function uniqueVals(getter){
  var set = {};
  CYCLES.forEach(function(cfg){ var cycle = STATE.cycles[cfg.id]; if (!cycle) return;
    cycle.rows.forEach(function(row){ var v = getter(cycle,row); if (v) set[v]=true; }); });
  return Object.keys(set).sort();
}
function isSelected(filterName, value){
  var f = STATE.filters[filterName];
  var anyOn = Object.keys(f).some(function(k){return f[k];});
  if (!anyOn) return true;
  return !!f[value];
}
function selectedCount(filterName){ var f=STATE.filters[filterName]; return Object.keys(f).filter(function(k){return f[k];}).length; }
function singleSelected(filterName){ var f=STATE.filters[filterName]; var keys=Object.keys(f).filter(function(k){return f[k];}); return keys.length===1 ? keys[0] : null; }

function passesMultiFilter(raw, filterName){
  // Para perguntas tipo checkbox (PCD, Neurodivergência) que podem ter vários valores na mesma célula.
  var f = STATE.filters[filterName];
  var anyOn = Object.keys(f).some(function(k){return f[k];});
  if (!anyOn) return true;
  if (!raw) return false; // filtro ativo mas essa linha/ciclo não tem dado pra essa pergunta -> não dá pra confirmar match
  var parts = splitCheckboxDesc(raw);
  return parts.some(function(p){ return !!f[p]; });
}
function passesFilters(cycle,row, opts){
  opts = opts || {};
  if (!isSelected('ciclo', cycle.id)) return false;
  var grp = currentGroup();
  if (grp !== 'missao' && !isSelected('pame', pame(cycle,row))) return false;
  if (!opts.skipArea && (grp==='coord' || grp==='dir') && !isSelected(grp==='dir'?'diretoria':'area', areaOrDirValueFor(cycle,row))) return false;
  if (grp !== 'missao' && !isSelected('cargo', cargoValueFor(cycle,row))) return false;
  // NOTE: genero/orient/raca só existem em alguns ciclos do PCO (por enquanto só Julho/26 tem o
  // bloco de diversidade). isSelected() já trata "nenhum filtro ativo -> todo mundo passa"; quando
  // um filtro ESTÁ ativo, linhas/ciclos sem resposta pra essa pergunta NÃO podem passar escondidas
  // (misturaria respondentes "desconhecidos" numa visão demográfica específica), por isso não
  // tratamos valor vazio como caso especial aqui.
  if (!isSelected('genero', genero(cycle,row))) return false;
  if (!isSelected('orient', orientacao(cycle,row))) return false;
  if (!isSelected('raca', raca(cycle,row))) return false;
  if (!passesMultiFilter(val(cycle,row,'pcd'), 'pcd')) return false;
  if (!passesMultiFilter(val(cycle,row,'neuro'), 'neuro')) return false;
  return true;
}
function eachFilteredRow(fn, opts){
  CYCLES.forEach(function(cfg){ var cycle = STATE.cycles[cfg.id]; if (!cycle || cycle.error) return;
    cycle.rows.forEach(function(row){ if (passesFilters(cycle,row,opts)) fn(cycle,row); }); });
}
function eachFilteredRowByCycle(cycleId, fn, opts){
  var cycle = STATE.cycles[cycleId]; if (!cycle || cycle.error) return;
  cycle.rows.forEach(function(row){ if (passesFilters(cycle,row,opts)) fn(cycle,row); });
}

/* --------- Faceted (cascading) option lists: opções de um filtro respeitam os OUTROS filtros
   ativos no momento (ex.: selecionar o ciclo Julho/26 já esconde PAMEs que só existem em outros
   ciclos). O próprio filtro é ignorado no cálculo das suas opções, senão marcar uma opção a
   faria desaparecer da própria lista. */
function passesFiltersExcept(cycle,row,exceptName){
  var grp = currentGroup();
  if (exceptName!=='ciclo' && !isSelected('ciclo', cycle.id)) return false;
  if (exceptName!=='pame' && grp!=='missao' && !isSelected('pame', pame(cycle,row))) return false;
  if (grp==='coord' || grp==='dir'){
    var dim = grp==='dir' ? 'diretoria' : 'area';
    if (exceptName!==dim && !isSelected(dim, areaOrDirValueFor(cycle,row))) return false;
  }
  if (exceptName!=='cargo' && grp!=='missao' && !isSelected('cargo', cargoValueFor(cycle,row))) return false;
  if (exceptName!=='genero' && !isSelected('genero', genero(cycle,row))) return false;
  if (exceptName!=='orient' && !isSelected('orient', orientacao(cycle,row))) return false;
  if (exceptName!=='raca' && !isSelected('raca', raca(cycle,row))) return false;
  if (exceptName!=='pcd' && !passesMultiFilter(val(cycle,row,'pcd'), 'pcd')) return false;
  if (exceptName!=='neuro' && !passesMultiFilter(val(cycle,row,'neuro'), 'neuro')) return false;
  return true;
}
function uniqueValsFacet(getter, exceptName){
  var set = {};
  CYCLES.forEach(function(cfg){ var cycle = STATE.cycles[cfg.id]; if (!cycle || cycle.error) return;
    cycle.rows.forEach(function(row){ if (!passesFiltersExcept(cycle,row,exceptName)) return; var v=getter(cycle,row); if (v) set[v]=true; }); });
  return Object.keys(set).sort();
}
function uniqueValsMultiFacet(getter, exceptName){
  var set = {};
  CYCLES.forEach(function(cfg){ var cycle = STATE.cycles[cfg.id]; if (!cycle || cycle.error) return;
    cycle.rows.forEach(function(row){ if (!passesFiltersExcept(cycle,row,exceptName)) return;
      var raw=getter(cycle,row); if(!raw) return;
      splitCheckboxDesc(raw).forEach(function(s){ if (s) set[s]=true; }); }); });
  return Object.keys(set).sort();
}

/* ============================= AGG HELPERS ================================ */
function meanOf(values){
  var v = values.filter(function(x){ return !isNaN(x); });
  if (!v.length) return { avg:null, n:0 };
  return { avg: v.reduce(function(a,b){return a+b;},0)/v.length, n:v.length };
}
function enpsOf(values){
  var v = values.filter(function(x){ return !isNaN(x); });
  if (!v.length) return { pct:null, n:0 };
  var p4 = v.filter(function(x){return x===4;}).length/v.length;
  var p12 = v.filter(function(x){return x===1||x===2;}).length/v.length;
  return { pct: (p4-p12)*100, n:v.length };
}
function distributionOf(values){
  var counts = {1:0,2:0,3:0,4:0}; var n=0;
  values.forEach(function(x){ x=Math.round(x); if (x>=1&&x<=4){ counts[x]++; n++; } });
  return { counts:counts, n:n };
}
function metricValue(keyFn){ var vals=[]; eachFilteredRow(function(c,r){ var v=keyFn(c,r); if(!isNaN(v)) vals.push(v); }); return meanOf(vals); }
function metricAcrossCycles(keyFn, opts){
  var out = {};
  CYCLES.forEach(function(cfg){ var vals=[]; eachFilteredRowByCycle(cfg.id, function(c,r){ var v=keyFn(c,r); if(!isNaN(v)) vals.push(v); }, opts); out[cfg.label]=meanOf(vals); });
  return out;
}
function freqOf(getterFn, splitComma, opts){
  var counts = {}; var total = 0;
  eachFilteredRow(function(cycle,row){
    var raw = getterFn(cycle,row); if (!raw) return;
    var parts = splitComma ? raw.split(',').map(function(s){return shortLabel(s);}).filter(Boolean) : [shortLabel(raw)];
    parts.forEach(function(p){ counts[p] = (counts[p]||0)+1; });
    total++;
  }, opts);
  return { counts:counts, total:total };
}

function buildChipBox(containerId, filterName, values, displayFn){
  var box = document.getElementById(containerId); if (!box) return;
  box.innerHTML = '';
  values.forEach(function(v){
    var chip = document.createElement('div');
    chip.className = 'chip' + (STATE.filters[filterName][v] ? ' on' : '');
    chip.textContent = displayFn ? displayFn(v) : v;
    chip.onclick = function(){ STATE.filters[filterName][v] = !STATE.filters[filterName][v]; renderAll(); };
    box.appendChild(chip);
  });
}
/* Dropdown de seleção múltipla: clica no botão, abre um painel com checkboxes das opções
   disponíveis. Usado pros filtros de diversidade (Gênero/Orientação/Raça/PCD/Neuro), que têm
   muitas opções e ficavam poluindo a barra quando eram chips sempre visíveis. */
var UI = { suppressOutsideClose:false };
function buildDropdownFilter(prefix, filterName, values, displayFn){
  var btn = document.getElementById(prefix+'-btn');
  var panel = document.getElementById(prefix+'-panel');
  if (!btn || !panel) return;
  var wasOpen = panel.classList.contains('open');
  panel.innerHTML = '';
  if (!values.length){
    panel.innerHTML = '<div class="dd-empty">Sem opções para o filtro atual.</div>';
  }
  values.forEach(function(v){
    var row = document.createElement('label');
    row.className = 'dd-item';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!STATE.filters[filterName][v];
    cb.onchange = function(){
      UI.suppressOutsideClose = true;
      STATE.filters[filterName][v] = cb.checked;
      renderAll();
    };
    row.appendChild(cb);
    row.appendChild(document.createTextNode(' ' + (displayFn ? displayFn(v) : v)));
    panel.appendChild(row);
  });
  var selected = values.filter(function(v){ return STATE.filters[filterName][v]; });
  btn.textContent = !selected.length ? 'Todos' : (selected.length===1 ? (displayFn?displayFn(selected[0]):selected[0]) : selected.length+' selecionados');
  btn.onclick = function(e){
    e.stopPropagation();
    var isOpen = panel.classList.contains('open');
    document.querySelectorAll('.dropdown-panel.open').forEach(function(p){ p.classList.remove('open'); });
    if (!isOpen) panel.classList.add('open');
  };
  if (wasOpen) panel.classList.add('open');
}
document.addEventListener('click', function(e){
  if (UI.suppressOutsideClose){ UI.suppressOutsideClose = false; return; }
  document.querySelectorAll('.dropdown-panel.open').forEach(function(p){
    if (!p.parentElement.contains(e.target)) p.classList.remove('open');
  });
});

  var pames = uniqueValsFacet(function(c,r){return pame(c,r);}, 'pame');
  var cargos = uniqueValsFacet(cargoValueFor, 'cargo');
  if (grp === 'coord') cargos = cargos.filter(function(v){ return CARGO_EXCLUDE_COORD.indexOf(v)===-1; });
  var areaOrDirVals = grp==='dir' ? DIRETORIAS.slice() : COORD_ALL.slice();
  var generos = uniqueValsFacet(function(c,r){return genero(c,r);}, 'genero');
  var orients = uniqueValsFacet(function(c,r){return orientacao(c,r);}, 'orient');
  var racas = uniqueValsFacet(function(c,r){return raca(c,r);}, 'raca');
  var pcds = uniqueValsMultiFacet(function(c,r){return val(c,r,'pcd');}, 'pcd');
  var neuros = uniqueValsMultiFacet(function(c,r){return val(c,r,'neuro');}, 'neuro');

  CYCLES.forEach(function(cfg){ if (STATE.filters.ciclo[cfg.id]===undefined) STATE.filters.ciclo[cfg.id]=true; });

  buildChipBox('f-pame','pame', pames);

    buildChipBox('f-area','diretoria', areaOrDirVals);
  } else {
    buildChipBox('f-area','area', areaOrDirVals, function(a){ return COORD_DISPLAY[a]; });
  }
  document.getElementById('f-cargo-label').textContent = grp==='dir' ? 'Cargo (papel na diretoria)' : 'Cargo';
  buildChipBox('f-cargo','cargo', cargos, grp==='dir' ? function(p){ return p==='Diretor/a' ? 'Diretor' : p; } : null);

  buildDropdownFilter('f-raca','raca', racas);
  buildDropdownFilter('f-pcd','pcd', pcds);
  buildDropdownFilter('f-neuro','neuro', neuros);

/* ============================= CHART HELPERS =============================== */
function mkChart(canvasId, cfg){
  var ctx = document.getElementById(canvasId); if (!ctx) return null;
  var chart = new Chart(ctx, cfg); STATE.charts.push(chart); return chart;
}
function hexToRgb(hex){
  var h = String(hex||'').replace('#','');
  if (h.length===3) h = h.split('').map(function(c){return c+c;}).join('');
  var num = parseInt(h,16) || 0;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
/* 4 tons (claro->escuro) de uma cor base, usados nos gráficos de pizza de distribuição 1-4 */
function distShades(hex){
  var c = hexToRgb(hex);
  return [0.32,0.55,0.78,1].map(function(a){ return 'rgba('+c.r+','+c.g+','+c.b+','+a+')'; });
}
function meanBar(canvasId, labels, values, colors, opts){
  opts = opts || {};
  // Notas vão de 1 a 4 (nunca 0), então o eixo de valor começa em 1 pra não achatar as barras.
  return mkChart(canvasId, {
    type:'bar',
    data:{ labels:labels, datasets:[{ label:'Média', data:values.map(function(v){return v!=null?Number(v.toFixed(2)):null;}), backgroundColor:colors }] },
    options:{ responsive:true, maintainAspectRatio:false, indexAxis: opts.horizontal?'y':'x',
      scales: opts.horizontal ? { x:{ min:1, max:4 } } : { y:{ min:1, max:4 } },
      plugins:{ legend:{ display:false } } }
  });
}
function distBar(canvasId, dist, color){
  var labels = ['Nota 1','Nota 2','Nota 3','Nota 4'];
  var data = [dist.counts[1],dist.counts[2],dist.counts[3],dist.counts[4]];
  return mkChart(canvasId, { type:'pie', data:{ labels:labels, datasets:[{ data:data, backgroundColor:distShades(color) }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:true, position:'right', labels:{boxWidth:10,font:{size:11}} } } } });
}
function freqBar(canvasId, freq, color, pct, top){
  var entries = Object.keys(freq.counts).map(function(k){return [k,freq.counts[k]];}).sort(function(a,b){return b[1]-a[1];});
  if (top) entries = entries.slice(0, top);
  var labels = entries.map(function(e){ return e[0].length>30? e[0].slice(0,28)+'…' : e[0]; });
  var data = entries.map(function(e){ return pct ? Math.round(1000*e[1]/(freq.total||1))/10 : e[1]; });
  return mkChart(canvasId, { type:'bar', data:{ labels:labels, datasets:[{label:pct?'%':'Respostas', data:data, backgroundColor:color}] },
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y',
      scales:{ x:{ beginAtZero:true, ticks: pct?{ callback:function(v){return v+'%';} }:undefined } },
      plugins:{ legend:{display:false} } } });
}
function groupedBar(canvasId, labels, values, colors, opts){
  opts = opts || {};
  // quando é uma escala de nota 1-4 (opts.max===4), o eixo também começa em 1, não em 0
  var scaleOpts = opts.max===4 ? { min: (opts.min!=null?opts.min:1), max:4 } : { beginAtZero:true, suggestedMax: opts.max };
  return mkChart(canvasId, { type:'bar', data:{ labels:labels, datasets:[{ label:'Valor', data:values, backgroundColor:colors }] },
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y: scaleOpts },
      plugins:{ legend:{display:false} } } });
}
function multiSeriesMeanBar(canvasId, groupLabels, series /* [{label,data,color}] */){
  return mkChart(canvasId, { type:'bar', data:{ labels:groupLabels, datasets: series.map(function(s){return {label:s.label,data:s.data,backgroundColor:s.color};}) },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ min:1, max:4 } },
      plugins:{ legend:{ display:true, position:'bottom', labels:{boxWidth:10,font:{size:11}} } } } });
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function kpiCard(label, valueText, sub){
  return '<div class="card kpi"><div class="label">'+label+'</div><div class="value">'+valueText+'</div><div class="sub">'+(sub||'')+'</div></div>';
}
function chartCard(canvasId, title, note, tall){
  return '<div class="card chart-card"><h3>'+title+'</h3><p class="note">'+note+'</p><div class="chart-wrap'+(tall?' tall':'')+'"><canvas id="'+canvasId+'"></canvas></div></div>';
}

/* ============================= PÁGINAS DE COORDENAÇÃO ======================= */
/* Coleta valores de uma métrica de "área" respeitando o filtro de Coordenação atual:
   - Se uma coordenação específica está selecionada (ex.: ACE), usa só quem tem Q2=ACE.
   - Se COM está selecionada, usa quem tem Q2=COMERCIAL (bloco de área) MESCLADO com quem é
     direcionado a Comercial (bloco de direcionado, direcKeyForCom) — só se direcKeyForCom existir.
   - Em modo "Geral" (nenhuma coordenação específica), usa todo mundo com Q2 numa das 6
     coordenações (cada pessoa conta 1x, pela sua área primária); direcionados a Comercial só
     entram aqui se sua área primária NÃO for nenhuma das 6 (raro, mas evita ficarem de fora). */
function collectAreaValues(bloco2Key, direcKeyForCom){
  var single = singleSelected('area');
  var vals = [];
  eachFilteredRow(function(c,r){
    var a = rawArea(c,r);
    var isPrimaryMatch = single ? (a === single) : (COORD_ALL.indexOf(a) !== -1);
    if (isPrimaryMatch){
      var v = num(c,r,bloco2Key); if (!isNaN(v)) vals.push(v);
    } else if ((!single || single==='COMERCIAL') && direcKeyForCom && isComDirecionado(c,r)){
      var v2 = num(c,r,direcKeyForCom); if (!isNaN(v2)) vals.push(v2);
    }
  }, {skipArea:true});
  return vals;
}
function areaMean(bloco2Key, direcKeyForCom){ return meanOf(collectAreaValues(bloco2Key, direcKeyForCom)); }
function areaDist(bloco2Key, direcKeyForCom){ return distributionOf(collectAreaValues(bloco2Key, direcKeyForCom)); }

/* ============================= INIT ========================================= */
function init(){
  Promise.all(CYCLES.map(loadCycle)).then(function(results){
    results.forEach(function(r){ STATE.cycles[r.id] = buildIndex(r); });
    var footBits = results.map(function(r){ return r.label+': '+(r.error? 'erro ao carregar ('+r.error+')' : r.rows.length+' respostas'); });
    // O formulário do PCO mudou levemente de ciclo para ciclo (perguntas adicionadas/removidas).
    // Avisa aqui quais blocos usados no Dash não existem em cada ciclo, em vez de deixar isso silencioso.
    var gapNotes = [];
    results.forEach(function(r){
      if (r.error) return;
      var c = STATE.cycles[r.id].col;
      var gaps = [];
      if (c.genero === -1) gaps.push('diversidade (gênero/orientação/raça/PCD/neurodivergência)');
      if (c.coord74_motivar === -1) gaps.push('avaliação de coordenadores (Q73–76)');
      if (c.primeiraMentoria === -1) gaps.push('detalhamento de mentorias (Q63.1–63.4)');
      if (gaps.length) gapNotes.push(r.label+' não tem: '+gaps.join('; '));
    });
    document.getElementById('footNote').innerHTML =
      'Fonte: planilhas de respostas do Google Forms (PCO), lidas ao vivo a cada abertura/recarregamento. '+footBits.join(' · ')+
      '. Médias em escala 1–4 calculadas apenas sobre quem respondeu cada pergunta (o formulário tem lógica condicional por cargo/área). '+
      'Dados de COM mesclam respostas diretas da coordenação com respostas de quem é "direcionado" a Comercial.'+
      (gapNotes.length ? ' <br>Atenção — o formulário variou entre ciclos: '+gapNotes.join(' · ')+
        '. Filtros/gráficos desses blocos consideram só os ciclos que têm a pergunta (as pessoas dos ciclos sem a pergunta são excluídas quando um filtro desse tipo está ativo).' : '');
    setupNav();
    renderAll(); // renderAll() já chama setupFilters() internamente
  }).catch(function(err){
    document.getElementById('content').innerHTML = '<div class="empty">Não foi possível carregar os dados: '+String(err && err.message || err)+'</div>';
  });
}
if (window.cowork && window.cowork.callMcpTool){ init(); } else { window.addEventListener('load', init); }

})();
</script>
</body>
</html>
